# CodeQL static analysis (advanced setup), added by MAIN's supply-chain order of
# 2026-10-05 (Scorecard SAST). Languages are the two this tree actually holds:
# python (tools/, ops/, tests/) and actions (the workflow files themselves).
# Neither needs a build, so both run with build-mode: none. Every `uses:` is
# pinned to a full commit SHA with its tag as the trailing comment; Dependabot's
# github-actions entry keeps the pins and comments current.

name: codeql

on:
  # MAIN REPO-REVIEW perf 2.4 (2026-10-09): CodeQL ran on every push (261 in
  # 38 days). A push now fires it only when analysed code changed: python files
  # or the workflows themselves. PR, weekly schedule and dispatch stay whole.
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # weekly, Monday, off the :00 mark
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one job in the tree that needs more than read: uploading SARIF needs
    # security-events: write. Scoped here, never at the workflow level.
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
