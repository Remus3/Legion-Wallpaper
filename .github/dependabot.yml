# Dependabot version updates (MAIN supply-chain order 2026-10-05). One entry per
# ecosystem actually present in this tree, weekly, one group per ecosystem so a
# week is at most one PR per ecosystem. Nothing here auto-merges. A bot PR is
# NEVER merged as-is (MAIN 0034 DEPENDABOT-MERGE-RULE; CLAUDE.md "Bot PRs"):
# close it with a one-line reason and re-apply the bump as an operator commit
# (path B), then read back tools/lw_postmerge_scan.py.
#
# pip: requirements.txt and requirements-cv.txt at the root are hash-pinned
# outputs compiled from requirements.in / requirements-cv.in; Dependabot
# updates the pins and the hashes together.
# github-actions: keeps the full-SHA `uses:` pins and their `# vX.Y.Z` comments
# current - that is how the pins stay fresh.
# No npm entry: the tree holds no package.json.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
