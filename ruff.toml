# ruff.toml - Legion Wallpaper
# Ported 1:1 from Riot Commander ruff.toml (RC per-file product entries dropped).
# Conservative config: catches real errors without churn
# target-version is the MINIMUM Python this code must run on, not the newest.
# Legion runs 3.14 locally and CI pins 3.14 (.github/workflows/ci.yml), so 3.14
# is the real floor - do not raise this above the CI pin.

target-version = "py314"
line-length = 120

# `exclude` alone is not enough, because ruff defaults force-exclude to FALSE:
# a path named EXPLICITLY on the command line bypasses `exclude` entirely, and
# naming staged paths explicitly is exactly what tools/precommit_gate.py does
# (`py -m ruff check --output-format=json <staged paths>` with cwd=repo root).
# Measured 2026-09-20 on ruff 0.15.12: `ruff check tools/dwpose_onnx/onnxdet.py`
# exited 1 with two B905 findings; the same command under force-exclude exits 0,
# "No Python files found". Only the gate's net-new-hunk filter was masking it, so
# a re-vendor of dwpose_onnx touching either line would have been BLOCKED by a
# rule this file says is excluded.
# Blast radius of turning it on, measured over `git ls-files '*.py'` (283 files):
# exactly those 2 findings disappear, both inside the vendored tree already
# declared below, and 0 findings on any file we maintain. `ruff check .` was 0
# findings either way.
# Top-level for a DIFFERENT measured reason than `exclude`, and the difference
# matters. Re-measured on ruff 0.15.12, 2026-09-20: `exclude` under [lint] is
# ACCEPTED and silently inert (exit 1, the vendored file linted anyway), while
# `force-exclude` under [lint] is an unknown field and ruff refuses the whole
# config - exit 2, empty stdout, `unknown field force-exclude`. precommit_gate
# .py swallows that into `findings = []`, so a misplaced key here does not read
# as stricter: it turns the gate's entire ruff pass off, silently. Pinned by
# tests/test_ruff_exclude_binds.py.
force-exclude = true

# Don't lint generated/runtime/cache/vendored dirs.
# MUST stay top-level: an `exclude` key under [lint] is silently INERT
# (measured on ruff 0.15.12 - the excluded file is still linted).
exclude = [
    "__pycache__",
    ".venv",
    "Claude",
    "ops/runtime",
    "ops/loop/control",
    "data",
    "logs",
    # Vendored third-party, not authored here - do not lint or "fix" it.
    # DWPose onnx-CPU localizer, vendored to avoid the mmcv dependency
    # (LEDGER 19). Upstream style is not ours to enforce; edits here
    # would be lost on the next re-vendor.
    "tools/dwpose_onnx",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (safe modern syntax)
    "B",    # flake8-bugbear (common bugs)
    "BLE",  # flake8-blind-except - ratchet: no NEW bare `except Exception`
]
ignore = [
    "E501",   # line too long - not enforced
    "E701",   # multiple statements on one line - deliberate style in this codebase
    "E702",   # statement ends with semicolon - deliberate in one-liners
    "E741",   # ambiguous variable names - common in short math/callbacks
    "B008",   # function calls in default args - used intentionally
    "B006",   # mutable default args - known pattern in project
    "UP007",  # X | Y union syntax - legal on py314, defer to a dedicated sweep
    "UP035",  # deprecated typing imports - defer to a dedicated sweep
    "UP037",  # remove quoted annotations - frozen files carry quoted forward-refs
    "F401",   # imported but unused - too noisy, especially in __init__.py
    "F841",   # local variable assigned but never used - noisy in callbacks
    "I001",   # import block unsorted - defer to a dedicated cleanup pass
    "UP006",  # Dict/List -> dict/list - cosmetic only
    "UP045",  # Optional[X] -> X | None - legal on py314, defer to a dedicated sweep
    "E402",   # module import not at top - unavoidable in ops/ sys.path scripts
    "B904",   # raise without from inside except - inherited RC style
    "B007",   # unused loop variable - intentional in callbacks
    "B027",   # empty method without abstract - stub pattern
    "E731",   # lambda assignment - intentional one-liners
]

[lint.per-file-ignores]
"ops/*.py" = ["B"]          # ops scripts are procedural, bugbear too strict
"ops/loop/*.py" = ["B"]     # loop infrastructure - same procedural style
"scripts/*.py" = ["B", "I"] # one-off scripts, ignore import order
"*/__init__.py" = ["F401"]  # __init__.py re-exports are expected

[lint.isort]
known-first-party = [
    "tools", "ops",
]
