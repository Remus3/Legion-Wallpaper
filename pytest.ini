[pytest]
# Bare `pytest` with no path used to walk the whole rootdir: it dragged in
# tools/test_lw_clean_dekel.py (imports skimage, which lives only in the
# cv-lane venv) and even stray tests under Claude extension directories, so
# it died at collection with 2 errors while `pytest tests/` was green.
# testpaths only applies when no path argument is given, so the explicit CI
# invocations (`pytest tests/ -q`, `pytest tests/test_lw_clean_dekel_align.py`)
# are unaffected.
testpaths = tests

# Temp-dir retention. Added 2026-09-19 after tmp_path dirs were found to be a
# major contributor to a bloated %TEMP% (68,630 files across only ~9 runs),
# which pushed the User Profile Service to ~155s at every logon and made the
# machine take ~2m50s to boot.
#
# WHY THIS LIVES HERE AND NOT IN A SCHEDULED SWEEP (re-measured 2026-09-20).
# pytest-of-<user> under %TEMP% is SHARED by every repo on this account, and an
# mtime-based sweep over it cannot tell a live run's dir from an abandoned one -
# referenced-and-idle looks exactly like dead. pytest CAN tell: each run dir
# carries a .lock, and pytest only reclaims a dir whose lock is older than
# LOCK_TIMEOUT (72h on pytest 9.0.3). So the safe place to bound LW's own
# footprint is LW's own config, where pytest owns the liveness decision.
#
# Values, chosen deliberately (defaults are policy=all, count=3):
#   policy=failed - drop each test's tmp_path as soon as the test PASSES. LW's
#     suite is ~3.1k tests and green, so `all` would retain essentially every
#     directory the suite creates for nothing. A failure still keeps its dir,
#     which is the only case anybody ever reads one.
#   count=1 - keep one generation of retained (i.e. failing) run dirs instead of
#     3. Enough to inspect the run that just failed; no deeper history, because
#     the root is shared and LW should not be the tree hoarding it.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
