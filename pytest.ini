[pytest]
# Bare `pytest` with no path used to walk the whole rootdir: it dragged in
# tools/test_lw_clean_dekel.py (imports skimage, which lives only in the
# cv-lane venv) and even stray tests under Claude extension directories, so
# it died at collection with 2 errors while `pytest tests/` was green.
# testpaths only applies when no path argument is given, so the explicit CI
# invocations (`pytest tests/ -q`, `pytest tests/test_lw_clean_dekel_align.py`)
# are unaffected.
testpaths = tests

# Temp-dir retention. Added 2026-09-19 after tmp_path dirs were found to be a
# major contributor to a bloated %TEMP% (68,630 files across only ~9 runs),
# which pushed the User Profile Service to ~155s at every logon and made the
# machine take ~2m50s to boot.
#
# WHY THIS LIVES HERE AND NOT IN A SCHEDULED SWEEP (re-measured 2026-09-20).
# pytest-of-<user> under %TEMP% is SHARED by every repo on this account, and an
# mtime-based sweep over it cannot tell a live run's dir from an abandoned one -
# referenced-and-idle looks exactly like dead. pytest CAN tell: each run dir
# carries a .lock, and pytest only reclaims a dir whose lock is older than
# LOCK_TIMEOUT (72h on pytest 9.0.3). So the safe place to bound LW's own
# footprint is LW's own config, where pytest owns the liveness decision.
#
# Values, chosen deliberately (defaults are policy=all, count=3):
#   policy=failed - drop each test's tmp_path as soon as the test PASSES. LW's
#     suite is ~3.1k tests and green, so `all` would retain essentially every
#     directory the suite creates for nothing. A failure still keeps its dir,
#     which is the only case anybody ever reads one.
#   count=1 - keep one generation of retained (i.e. failing) run dirs instead of
#     3. Enough to inspect the run that just failed; no deeper history, because
#     the root is shared and LW should not be the tree hoarding it.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1

# An emptied pin must go RED, not green. Added 2026-10-02.
#
# LW found this class and broadcast it: every arm parametrized off a pin
# collapses to ZERO CASES when the pin empties, and pytest's DEFAULT for a
# zero-case parametrize is to emit one SKIPPED placeholder. Measured on this
# tree before the repair: `SHARED_SHA256 = {}` - one dict literal - reduced the
# four-arm cross-repo parity guard to "1 passed, 3 skipped", exit 0, green run,
# guard gone. A skip is not a pass, and nothing in a green summary says so.
#
# fail_at_collect makes a zero-case parametrize a COLLECTION ERROR instead, so
# the suite cannot exit 0 with an arm silently disarmed.
#
# A parametrize that is LEGITIMATELY empty must then say so AT THE CALL SITE.
# MEASURED, because the obvious spelling does not exist: `empty_parameter_set_mark`
# is an INI-ONLY option in pytest 9.0.3 (_pytest/mark/structures.py:
# EMPTY_PARAMETERSET_OPTION), and passing it as a parametrize kwarg raises
# TypeError at collection. The working call-site opt-out is a skipped SENTINEL
# case, which keeps the set non-empty on purpose:
#
#     @pytest.mark.parametrize("x", PIN or [pytest.param(
#         None, marks=pytest.mark.skip(reason="PIN is deliberately empty"))])
#
# Verified: that collects, reports one skip, and exits 0.
# That is the whole point of setting fail_at_collect here rather than leaving
# the default: "this one is allowed to be empty" becomes a decision recorded in
# the file with a reason, reviewable in a diff, instead of a global default that
# hides every case. As of this commit NO parametrize in tests/ is empty, so the
# setting currently costs nothing and only guards the future.
#
# Proven live, not just configured: tests/test_empty_parametrize_is_red.py runs
# a real pytest subprocess against a crafted zero-case parametrize and observes
# the collection outcome. Reading this value back out of the ini would only
# prove the string is present, not that it is in effect.
empty_parameter_set_mark = fail_at_collect
